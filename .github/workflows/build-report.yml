name: Validate MORPHOIA report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MORPHOIA report dependencies
        run: python -m pip install -e '.[report,dev]'

      - name: Preserve committed report
        run: |
          cp docs/phase1/MORPHOIA_phase1_etat_art_faisabilite.pdf "$RUNNER_TEMP/MORPHOIA-phase1-committed.pdf"
          cp docs/phase2/MORPHOIA_phase2_standard_candidate_v0.1.pdf "$RUNNER_TEMP/MORPHOIA-phase2-committed.pdf"

      - name: Rebuild and validate report
        run: make check

      - name: Detect semantic drift
        run: >-
          python scripts/check_report_drift.py
          "$RUNNER_TEMP/MORPHOIA-phase1-committed.pdf"
          docs/phase1/MORPHOIA_phase1_etat_art_faisabilite.pdf

      - name: Detect Phase 2 semantic drift
        run: >-
          python scripts/check_report_drift.py
          "$RUNNER_TEMP/MORPHOIA-phase2-committed.pdf"
          docs/phase2/MORPHOIA_phase2_standard_candidate_v0.1.pdf

      - name: Upload validated report
        uses: actions/upload-artifact@v4
        with:
          name: MORPHOIA-phase1-report
          path: docs/phase1/MORPHOIA_phase1_etat_art_faisabilite.pdf

      - name: Upload validated Phase 2 report
        uses: actions/upload-artifact@v4
        with:
          name: MORPHOIA-phase2-report
          path: docs/phase2/MORPHOIA_phase2_standard_candidate_v0.1.pdf
