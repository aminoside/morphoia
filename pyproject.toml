[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morphoia"
version = "0.2.0.dev0"
description = "Morphoia Engine IR SDK with an experimental construction-graph prototype"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Olivier Ami" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

dependencies = [
  "jsonschema==4.25.1"
]

[project.optional-dependencies]
report = [
  "pypdf==6.10.0",
  "reportlab==4.4.9"
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1"
]

[project.scripts]
morphoia = "morphoia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/morphoia/schemas" = [
  "schemas/morphoia-engine-ir-manifest-0.1.0.schema.json",
  "schemas/morphoia-engine-ir-replay-0.1.0.schema.json",
  "schemas/morphoia-ir-0.1.schema.json"
]

[tool.ruff]
target-version = "py312"
line-length = 100
